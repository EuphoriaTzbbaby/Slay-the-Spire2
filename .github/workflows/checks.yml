name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check repository layout and protocol examples
        run: python scripts/check_repository.py
  game-control-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check game action control without game installation
        run: python scripts/game_dev.py check
      - name: Install WebSocket dependency for audio-free contract checks
        run: python -m pip install "websockets>=14,<17"
      - name: Check voice protocol and CSharp client without audio devices
        env:
          SPIRE_VOICE_WIRE_CHECK: "1"
          PYTHONUTF8: "1"
        run: python -m unittest discover -s voice/tests -v
