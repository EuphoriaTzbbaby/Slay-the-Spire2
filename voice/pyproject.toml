[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spire-voice"
version = "0.1.0"
description = "Local Chinese microphone and system speech bridge for SpireCompanion"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<17", "sounddevice>=0.5,<0.6", "vosk>=0.3.44,<0.4"]

[project.scripts]
spire-voice = "spire_voice.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
