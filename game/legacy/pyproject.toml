[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spirepilot"
version = "0.4.0"
description = "Local combat advisor for Slay the Spire 2"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SpirePilot contributors"}]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
spirepilot = "spirepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spirepilot = []
